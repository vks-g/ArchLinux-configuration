# /etc/nixos/config/programs/hyprlock/hyprlock.conf
# "CLEAN WINDOWS" STYLE - CATPPUCCIN MOCHA

# ============================================================================
# CATPPUCCIN MOCHA PALETTE
# ============================================================================
$base       = rgb(30, 30, 46)
$mantle     = rgb(24, 24, 37)
$crust      = rgb(17, 17, 27)
$text       = rgb(205, 214, 244)
$subtext1   = rgb(186, 194, 222)
$subtext0   = rgb(166, 173, 200)
$overlay0   = rgb(108, 112, 134)
$surface0   = rgb(49, 50, 68)
$surface1   = rgb(69, 71, 90)
$lavender   = rgb(180, 190, 254)
$mauve      = rgb(203, 166, 247)
$sapphire   = rgb(116, 199, 236)
$blue       = rgb(137, 180, 250)
$sky        = rgb(137, 220, 235)
$teal       = rgb(148, 226, 213)
$green      = rgb(166, 227, 161)
$peach      = rgb(250, 179, 135)
$rosewater  = rgb(245, 224, 220)
$flamingo   = rgb(242, 205, 205)
$pink       = rgb(245, 194, 231)
$red        = rgb(243, 139, 168)

# ============================================================================
# GENERAL
# ============================================================================
general {
    no_fade_in           = false
    grace                = 0
    disable_loading_bar  = true
    hide_cursor          = true
    ignore_empty_input   = false
    text_trim            = true
}

# ============================================================================
# BACKGROUND
# ============================================================================
background {
    monitor      =
    path         = screenshot
    color        = rgba(30, 30, 46, 0.85)
    
    blur_passes  = 4
    blur_size    = 5
    noise        = 0.01
    contrast     = 0.9
    brightness   = 0.55
    vibrancy     = 0.17
    vibrancy_darkness = 0.0
}

# ============================================================================
# TIME
# ============================================================================
label {
    monitor      =
    text         = cmd[update:1000] echo "$(date +"%H:%M")"
    color        = $text
    font_size    = 120
    font_family  = JetBrains Mono Nerd Font ExtraBold
    position     = 0, 150
    halign       = center
    valign       = center
}

# ============================================================================
# DATE (Below Time)
# ============================================================================
label {
    monitor      =
    text         = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color        = $subtext0
    font_size    = 18
    font_family  = JetBrains Mono Nerd Font Bold
    position     = 0, 40
    halign       = center
    valign       = center
}

# ============================================================================
# INPUT FIELD (Centered - Invisible Box with Dots, Appears when typing)
# ============================================================================
input-field {
    monitor      =
    size         = 400, 80
    outline_thickness = 0
    dots_size    = 0.4
    dots_spacing = 0.4
    dots_center  = true
    dots_rounding = -1
    
    # Invisible box
    rounding     = -1

    # Colors (all transparent)
    outer_color  = rgba(0, 0, 0, 0)
    inner_color  = rgba(0, 0, 0, 0)
    font_color   = $text
    
    fade_on_empty = true
    fade_timeout = 100
    placeholder_text = 
    hide_input   = false 
    
    check_color  = rgba(0, 0, 0, 0)
    fail_color   = rgba(0, 0, 0, 0)
    fail_text    = <i><b>$FAIL</b></i>
    capslock_color = rgba(0, 0, 0, 0)
    
    # Below date
    position     = 0, -150
    halign       = center
    valign       = center
}
