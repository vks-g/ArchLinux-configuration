$mainMod = SUPER
$terminal = kitty

# ───────── Gestures ─────────
gesture = 3, horizontal, workspace

bind = $mainMod, m, exec, ~/.config/hypr/scripts/resume.sh

# ───────── Mouse binds ─────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ───────── Resize ─────────
binde = $mainMod&SHIFT_L, left, resizeactive, -50 0
binde = $mainMod&SHIFT_L, right, resizeactive, 50 0
binde = $mainMod&SHIFT_L, up, resizeactive, 0 -50
binde = $mainMod&SHIFT_L, down, resizeactive, 0 50

# ───────── Media / OSD ─────────
bindl = SHIFT_L, ALT_L, exec, hyprctl switchxkblayout main next
bindl = ALT_L, SHIFT_L, exec, hyprctl switchxkblayout main prev
bindl = $mainMod, p, exec, playerctl play-pause
bindl = $mainMod, 8, exec, playerctl play-pause
#bindl = , 7, exec, playerctl play-pause
bindl = , xf86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = , xf86audiomute, exec, swayosd-client --output-volume mute-toggle
bindl = , F9, exec, ddcutil setvcp 10 - 5
bindl = , F10, exec, ddcutil setvcp 10 + 5
bindl = SHIFT_L, F4, exec, ~/.config/hypr/scripts/screenshot.sh
bindl = SHIFT_L, ALT_R, exec, ~/.config/hypr/scripts/screenshot.sh --edit
bindl = , XF86PowerOff, exec, hyprlock --config ~/.config/hypr/hyprlock/hyprlock.conf

bindel = , F11, exec, swayosd-client --output-volume lower
bindel = , F12, exec, swayosd-client --output-volume raise
bindel = $mainMod, BACKSPACE, exec, hyprlock --config ~/.config/hypr/hyprlock/hyprlock.conf

# ───────── App launchers ─────────
bind = $mainMod, SPACE, exec, bash ~/.config/hypr/scripts/rofi_show.sh drun
bind = ALT, TAB, exec, bash ~/.config/hypr/scripts/rofi_show.sh window
bind = $mainMod, TAB, exec, bash ~/.config/hypr/scripts/quicklinks.sh
bind = $mainMod, C, exec, bash ~/.config/hypr/scripts/rofi_clipboard.sh
# bind = $mainMod, M, exec, bash ~/.config/hypr/scripts/monitors.sh
bind = $mainMod, A, exec, swaync-client -t -sw
bind = $mainMod&SHIFT_L, F, togglefloating,
bind = $mainMod&SHIFT_L, R, exec, bash ~/.config/eww/bar/launch_bar.sh

# ───────── Quickshell widgets ─────────
bind = $mainMod&SHIFT_L, S, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle stewart
bind = $mainMod, , exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle music
bind = ,, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle battery
bind = $mainMod, g, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle wallpaper
bind = ,, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle calendar
bind = ,, exec, bash ~/.config/hypr/scripts/qs_manager.sh toggle network

# ───────── Apps ─────────
bind = $mainMod, F, exec, zen-browser
bind = $mainMod, F3, exec, nautilus --new-window
bind = $mainMod, S, exec, spotify
bind = $mainMod, D, exec, vesktop
bind = $mainMod, O, exec, obsidian
bind = $mainMod, RETURN, exec, $terminal

# ───────── Kill active ─────────
bind = $mainMod, b, exec, bash -c 'if hyprctl activewindow | grep -q "title: qs-master"; then ~/.config/hypr/scripts/qs_manager.sh close; else hyprctl dispatch killactive; fi'

# ───────── Move windows ─────────
bind = $mainMod&CTRL, left, movewindow, h
bind = $mainMod&CTRL, right, movewindow, l
bind = $mainMod&CTRL, up, movewindow, k
bind = $mainMod&CTRL, down, movewindow, j

# ───────── Focus ─────────
bind = $mainMod&ALT, h, movefocus, l
bind = $mainMod&ALT, l, movefocus, r
bind = $mainMod&ALT, k, movefocus, u
bind = $mainMod&ALT, j, movefocus, d

# ───────── Workspaces ─────────
bind = $mainMod, i, exec, ~/.config/hypr/scripts/qs_manager.sh 1
bind = $mainMod, q, exec, ~/.config/hypr/scripts/qs_manager.sh 2
bind = $mainMod, w, exec, ~/.config/hypr/scripts/qs_manager.sh 3
bind = $mainMod, e, exec, ~/.config/hypr/scripts/qs_manager.sh 4
bind = $mainMod, r, exec, ~/.config/hypr/scripts/qs_manager.sh 5
bind = $mainMod, t, exec, ~/.config/hypr/scripts/qs_manager.sh 6
bind = $mainMod, y, exec, ~/.config/hypr/scripts/qs_manager.sh 7
bind = $mainMod, F8, exec, ~/.config/hypr/scripts/qs_manager.sh 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/qs_manager.sh 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/qs_manager.sh 10

# ───────── Move to workspaces ─────────
bind = $mainMod SHIFT, q, exec, ~/.config/hypr/scripts/qs_manager.sh 1 move
bind = $mainMod SHIFT, w, exec, ~/.config/hypr/scripts/qs_manager.sh 2 move
bind = $mainMod SHIFT, e, exec, ~/.config/hypr/scripts/qs_manager.sh 3 move
bind = $mainMod SHIFT, r, exec, ~/.config/hypr/scripts/qs_manager.sh 4 move
bind = $mainMod SHIFT, t, exec, ~/.config/hypr/scripts/qs_manager.sh 5 move
bind = $mainMod SHIFT, y, exec, ~/.config/hypr/scripts/qs_manager.sh 6 move
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/qs_manager.sh 7 move
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/qs_manager.sh 8 move
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/qs_manager.sh 9 move
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/qs_manager.sh 10 move
